name = "lukas-studio-api"
main = "src/index.js"
compatibility_date = "2026-01-01"

# Create the namespace once:  npx wrangler kv namespace create STUDIO
# then paste the id it prints below.
[[kv_namespaces]]
binding = "STUDIO"
id = "92f802a9b9a246ddb3a8f4ab17dc22bb"

[vars]
# Which Beacons product names unlock which products: see DEFAULT_PRODUCTS in src/index.js
# (Money Plan Studio, The Systemized Year, the hidden Year upgrade, Systemized Life Pass, The Autopilot Workbook).
# To change them without a code edit, set PRODUCTS to the same JSON shape, e.g.
# PRODUCTS = '[{"match":"money plan studio","grants":["studio"]}]'
MAX_DEVICES = "3"
# Comma-separated. Leave empty while testing locally.
ALLOWED_ORIGINS = "https://niglasa-bit.github.io,https://thesystemizedlife.com,https://www.thesystemizedlife.com"
# Where the apps live; links in the purchase email and on the thank-you page.
# Uncomment once thesystemizedlife.com serves this repo (until then the GitHub Pages address is used).
# APP_BASE = "https://thesystemizedlife.com"
# One line under the purchase email.
SELLER = "Sold via Stripe for Sevenflowlabs Oy, Business ID 3660293-5"
# /activate limits per hour (defaults 60 per IP, 10 per email):
# RATE_ACTIVATE_IP = "60"
# RATE_ACTIVATE_EMAIL = "10"

# Secrets (set with: npx wrangler secret put NAME):
#   SIGNING_SECRET    long random string, signs device tokens
#   SYNC_SECRET       shared with the Gmail Apps Script (sync + mail webhook)
#   ADMIN_TOKEN       opens /admin (type it when asked, or /admin#token=...)
#   STRIPE_WEBHOOK_SECRET  whsec_... from the Stripe webhook endpoint (/stripe-webhook)
#   STRIPE_SECRET_KEY      optional, a restricted key with Checkout Sessions read; only used when a
#                          Payment Link has no metadata.product
#   MAIL_WEBHOOK_URL  the Apps Script web-app URL (sends codes from your Gmail). Optional:
#   RESEND_API_KEY + MAIL_FROM   if you later get a domain and prefer Resend
