<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thank You</title><meta name="robots" content="noindex">
<link rel="stylesheet" href="style.css"><script src="config.js"></script></head>
<body><div class="wrap">
<h1>Thank you ☕</h1>
<div id="box" class="card"><p>Getting your order code…</p></div>
<p class="small">The same code is on its way to your email. Keep it: it unlocks the app on up to 3 devices.<br>
Can't find it? Reply to the purchase email and Lukas will sort it out by hand.</p>
<footer><a href="./">Back to the shop</a> · <a href="legal.html">Terms, refunds &amp; privacy</a></footer>
</div>
<script>
var S = window.SHOP, box = document.getElementById("box");
var id = new URLSearchParams(location.search).get("session_id") || "";
function esc(s){return String(s||"").replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
var tries = 0;
function late(){ box.innerHTML = "<p>Your payment went through, but the order is taking longer than usual. Your order code will arrive by email in a few minutes.</p>"; }
function poll(){
  if (!/^cs_(test|live)_/.test(id)) { box.innerHTML = "<p>No order found in this link. Your order code is in the purchase email.</p>"; return; }
  fetch(S.api.replace(/\/+$/,"") + "/order?session_id=" + encodeURIComponent(id)).then(function(r){return r.json();}).then(function(j){
    if (j.status === "ready") {
      var apps = (j.apps||[]).map(function(a){return "<p><a class='btn' href='../"+esc(a.url.split("/").slice(-2).join("/"))+"'>Open "+esc(a.name)+"</a></p>";}).join("");
      box.innerHTML = "<p>Your order code for <b>"+esc(j.product)+"</b>:</p><div class='code'>"+esc(j.order)+"</div>"+apps+
        "<p class='small'>In the app, enter the email you bought with ("+esc(j.email)+") and this code. We'll email you a 6-digit code to confirm.</p>";
    } else if (j.status === "waiting" && ++tries < 30) setTimeout(poll, 2000);
    else late();
  }).catch(function(){ if (++tries < 30) setTimeout(poll, 3000); else late(); });
}
poll();
</script></body></html>
