name: check
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax, manifests and links
        run: node scripts/check.mjs
      - name: Worker tests
        run: node studio-api/test/api.test.mjs
